[project]
name = "docs-qa"
version = "0.1.0"
description = "Handwritten Vietnamese document QA with citations and evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "gradio>=5,<6",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "pytest>=8,<9",
  "docling>=2.0,<3",
  "ragas>=0.4,<0.5",
  "sentence-transformers>=5,<6",
  "rank-bm25>=0.2,<1",
  "langchain-community==0.3.29",
  "transformers==5.17.0",
]

[project.scripts]
docsqa-ui = "docsqa.ui:serve_ui"
docsqa-api = "docsqa.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsqa"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires local PostgreSQL and pgvector",
]
